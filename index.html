<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F7F4;--surface:#FFFFFF;--surface2:#F2F1EE;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
  --text:#1A1917;--text2:#6B6A67;--text3:#9E9D9A;
  --accent:#4F46E5;--accent-l:rgba(79,70,229,.08);--accent-hover:#4338CA;
  --danger:#EF4444;--success:#10B981;--warn:#F59E0B;
  --rad:10px;--rad-lg:14px;--rad-xl:18px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111110;--surface:#1C1C1A;--surface2:#252523;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
    --text:#F0EFEb;--text2:#A8A7A3;--text3:#6B6A67;
  }
}
html{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
body{min-height:100vh}

.view-toggle{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;background:var(--surface);border:0.5px solid var(--border2);border-radius:100px;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden}
.vt-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:13px;font-weight:500;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.vt-btn.act{background:var(--accent);color:#fff}
.vt-btn:not(.act):hover{background:var(--surface2);color:var(--text)}
.vt-sep{width:0.5px;background:var(--border2);flex-shrink:0}

.app{max-width:1000px;margin:0 auto;padding:16px 16px 80px}
body.force-mobile .app{max-width:390px}
body.force-desktop .app{max-width:1000px}

.hdr{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rad-xl);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ic i{color:#fff;font-size:18px}
.logo-text{font-size:16px;font-weight:600;color:var(--text)}
.badge-gs{font-size:11px;color:var(--success);background:rgba(16,185,129,.1);padding:2px 8px;border-radius:20px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-sm{background:none;border:0.5px solid var(--border2);border-radius:var(--rad);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:5px;font-weight:500;transition:background .15s}
.btn-sm:hover:not(:disabled){background:var(--surface2)}
.btn-sm:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--accent);color:#fff;border:none;border-radius:var(--rad);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}
.btn-p:hover:not(:disabled){background:var(--accent-hover)}
.btn-p:disabled{opacity:.45;cursor:not-allowed}

.setup{background:rgba(251,191,36,.07);border:0.5px solid rgba(251,191,36,.35);border-radius:var(--rad-xl);padding:20px 24px;margin-bottom:14px}
.setup-t{font-size:14px;font-weight:600;color:#92400E;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.schema-box{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--rad);padding:14px 16px;margin-top:10px}
.schema-ttl{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.sct{width:100%;border-collapse:collapse;font-size:12px}
.sct th{text-align:left;font-size:11px;color:var(--text3);padding:3px 8px;border-bottom:0.5px solid var(--border)}
.sct td{padding:4px 8px;color:var(--text2);border-bottom:0.5px solid var(--border)}
.sct td:first-child{font-weight:600;color:var(--accent);font-family:monospace}
.sct tr:last-child td{border-bottom:none}
.gas-code{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rad);padding:14px;margin-top:8px;font-size:11px;font-family:monospace;color:var(--text2);overflow-x:auto;white-space:pre;line-height:1.7;max-height:280px;overflow-y:auto}
.url-row{display:flex;gap:8px;margin-top:10px}
.url-row input{flex:1;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--rad);padding:9px 14px;background:var(--surface);color:var(--text)}
.url-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.btn-conn{background:var(--accent);color:#fff;border:none;border-radius:var(--rad);padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-conn:hover:not(:disabled){background:var(--accent-hover)}
.btn-conn:disabled{opacity:.5;cursor:not-allowed}

.toast-area{margin-bottom:10px}
.toast{border-radius:var(--rad);padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:500}
.toast.s{background:rgba(16,185,129,.08);border:0.5px solid rgba(16,185,129,.3);color:#065F46}
.toast.e{background:rgba(239,68,68,.06);border:0.5px solid rgba(239,68,68,.25);color:#991B1B}
.toast.l{background:var(--accent-l);border:0.5px solid rgba(79,70,229,.2);color:#3730A3}
@media(prefers-color-scheme:dark){.toast.s{color:#34D399}.toast.e{color:#F87171}.toast.l{color:#818CF8}}
.spinner{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}

.sum-grid{display:grid;gap:12px;margin-bottom:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rad-lg);padding:18px;box-shadow:var(--shadow)}
.card-p{background:var(--accent);border:none}
.c-lbl{font-size:11px;color:var(--text3);letter-spacing:.05em;margin-bottom:6px;text-transform:uppercase;font-weight:500}
.card-p .c-lbl{color:rgba(255,255,255,.6)}
.c-amt{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.card-p .c-amt{color:#fff}
.c-sub{font-size:11px;color:var(--text3);margin-top:5px}
.card-p .c-sub{color:rgba(255,255,255,.55)}
.hrow{display:flex;align-items:flex-start;justify-content:space-between}
.ic-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:background .15s}
.ic-btn:hover{background:rgba(255,255,255,.25)}
.trend{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:4px}
.trend.up{color:var(--danger)}.trend.dn{color:var(--success)}.trend.fl{color:var(--text3)}
.brow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.brow .lb{display:flex;align-items:center;gap:7px;color:var(--text2)}
.brow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.brow .vl{font-weight:600;color:var(--text)}
.bdiv{border-top:0.5px dashed var(--border2);margin:6px 0}

.mg{display:grid;gap:12px}
@media(min-width:640px){.mg{grid-template-columns:1fr 270px}}
body.force-mobile .mg{grid-template-columns:1fr!important}
body.force-desktop .mg{grid-template-columns:1fr 270px!important}
body.force-mobile .sum-grid{grid-template-columns:1fr!important}

.tabs{display:flex;border-bottom:0.5px solid var(--border)}
.tab{flex:1;padding:13px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.act{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-l)}
.tab:hover:not(.act){color:var(--text2);background:var(--surface2)}

.ei{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:0.5px solid var(--border);transition:background .1s}
.ei:hover{background:var(--surface2)}
.ei:last-child{border-bottom:none}
.cic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ei-inf{flex:1;min-width:0}
.ei-nm{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-mt{font-size:11px;color:var(--text3);margin-top:2px}
.ei-am-wrap{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:2px}
.ei-am{font-size:14px;font-weight:600;color:var(--text)}
.ei-am.inc{color:var(--success)}
.ei-am-foreign{font-size:11px;color:var(--text3);font-weight:500}
.exp-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px;opacity:0;transition:opacity .15s;flex-shrink:0;border-radius:6px}
.ei:hover .exp-del{opacity:1}
.exp-del:hover:not(:disabled){color:var(--danger);background:rgba(239,68,68,.08)}
.exp-del:disabled{cursor:not-allowed}
.empty{padding:48px 20px;text-align:center;color:var(--text3)}

.cn{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.ct{font-size:14px;font-weight:600;color:var(--text)}
.cnb{background:none;border:0.5px solid var(--border2);border-radius:var(--rad);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s}
.cnb:hover{background:var(--surface2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 14px 14px}
.ch{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:500}
.cc{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:500;transition:background .1s}
.cc:hover{background:var(--surface2)}
.cc.has{background:rgba(251,191,36,.13);color:var(--text)}
.cc.tod{background:var(--accent-l);outline:1.5px solid rgba(79,70,229,.35);color:var(--accent)}
.cc.sel{background:var(--accent);color:#fff}
.camt{font-size:9px;color:#D97706;margin-top:1px}
.cc.sel .camt{color:rgba(255,255,255,.75)}
.cd{border-top:0.5px solid var(--border);padding:14px 18px}

.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.st2{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.fbadge{font-size:11px;font-weight:600;color:#7C3AED;background:rgba(124,58,237,.1);padding:2px 10px;border-radius:20px}
.fbadge.inc{color:var(--success);background:rgba(16,185,129,.1)}

.fi2{display:flex;align-items:center;justify-content:space-between;padding:7px 18px;font-size:13px;gap:8px}
.fi2-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.fi2-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fi2-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi2-cat{font-size:10px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:10px;flex-shrink:0}
.fi2-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.fix-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;opacity:0;padding:0 0 0 4px;border-radius:6px}
.fi2:hover .fix-del{opacity:1}
.fix-del:hover:not(:disabled){color:var(--danger)}
.fix-del:disabled{cursor:not-allowed}

.finp{display:flex;gap:6px;padding:8px 14px 16px;flex-wrap:wrap}
.finp input,.finp select{font-size:13px;border:0.5px solid var(--border2);border-radius:var(--rad);padding:8px 10px;background:var(--surface);color:var(--text)}
.finp input:focus,.finp select:focus{outline:none;border-color:var(--accent)}
.fx-name{flex:1;min-width:100px}
.fx-cat{width:100px;flex-shrink:0}
.fx-amt{width:80px;flex-shrink:0}
.inp-add{background:var(--accent);color:#fff;border:none;border-radius:var(--rad);width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background .15s}
.inp-add:hover:not(:disabled){background:var(--accent-hover)}
.inp-add:disabled{opacity:.45;cursor:not-allowed}

.dw{padding:10px 18px 16px;display:flex;flex-direction:column;align-items:center}
.donut-divider{border-top:0.5px dashed var(--border2);margin:10px 18px 0}
.lr{display:flex;justify-content:space-between;width:100%;font-size:12px;padding:3px 0}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.llb{display:flex;align-items:center;gap:6px;color:var(--text2)}
.lv{font-weight:600;color:var(--text)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:520px){.ov{align-items:center}}
body.force-desktop .ov{align-items:center}
body.force-mobile .ov{align-items:flex-end}
.modal{background:var(--surface);border-radius:var(--rad-xl);width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:0.5px solid var(--border)}
.mt2{font-size:15px;font-weight:600;color:var(--text)}
.mc{background:none;border:0.5px solid var(--border2);border-radius:8px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;transition:background .15s}
.mc:hover{background:var(--surface2)}
.mb{padding:22px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.fg{margin-bottom:16px}
.fl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;display:block;letter-spacing:.02em}
.fl .req{color:var(--danger)}
.fi3{width:100%;font-size:14px;border:0.5px solid var(--border2);border-radius:var(--rad);padding:10px 14px;background:var(--surface);color:var(--text);transition:border-color .15s}
.fi3:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.aw{position:relative}
.apfx{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);pointer-events:none}
.aw .fi3{padding-left:28px}
.fe{font-size:12px;color:var(--danger);background:rgba(239,68,68,.06);border-radius:8px;padding:9px 14px;margin-bottom:12px;border:0.5px solid rgba(239,68,68,.2)}
.sub{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--rad);padding:13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.sub:hover:not(:disabled){background:var(--accent-hover)}
.sub:disabled{opacity:.5;cursor:not-allowed}
.biw{position:relative;margin-bottom:22px}
.bpfx{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--text3)}
.binp{width:100%;font-size:24px;font-weight:700;border:0.5px solid var(--border2);border-radius:var(--rad);padding:16px 16px 16px 40px;background:var(--surface);color:var(--text);letter-spacing:-.5px}
.binp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.mbtns{display:flex;gap:10px}
.btn-cancel{flex:1;border:0.5px solid var(--border2);border-radius:var(--rad);padding:12px;font-size:14px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text2);transition:background .15s}
.btn-cancel:hover{background:var(--surface2)}
.btn-save{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--rad);padding:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn-save:hover:not(:disabled){background:var(--accent-hover)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

.tgl-grp{display:flex;background:var(--surface2);border-radius:8px;padding:4px;margin-bottom:16px}
.tgl-btn{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-radius:6px;transition:all 0.2s}
.tgl-btn.act{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="view-toggle">
  <button class="vt-btn" id="vt-auto" onclick="setView('auto')"><i class="ti ti-layout-sidebar" aria-hidden="true"></i>자동</button>
  <div class="vt-sep"></div>
  <button class="vt-btn" id="vt-mobile" onclick="setView('mobile')"><i class="ti ti-device-mobile" aria-hidden="true"></i>모바일</button>
  <div class="vt-sep"></div>
  <button class="vt-btn" id="vt-desktop" onclick="setView('desktop')"><i class="ti ti-device-desktop" aria-hidden="true"></i>데스크톱</button>
</div>

<div class="app" id="appWrap">

<div class="setup" id="setupBanner">
  <div class="setup-t"><i class="ti ti-table" style="font-size:16px" aria-hidden="true"></i>Google Sheets 연동 설정</div>
  <div style="font-size:13px;color:var(--text2);line-height:1.7">
    <div style="margin-top:12px">
      <label style="display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">배포된 웹 앱 URL 입력</label>
      <div class="url-row">
        <input type="url" id="urlInp" placeholder="https://script.google.com/macros/s/…/exec">
        <button class="btn-conn" id="connBtn" onclick="connect()"><i class="ti ti-plug" style="font-size:14px" aria-hidden="true"></i>연결</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-area" id="toastArea"></div>

<div id="main" style="display:none">
  <div class="hdr">
    <div class="logo">
      <div class="logo-ic"><i class="ti ti-wallet" aria-hidden="true"></i></div>
      <span class="logo-text">내 가계부</span>
      <span class="badge-gs">Sheets 연동</span>
    </div>
    <div class="hdr-r">
      <button class="btn-sm" onclick="refreshData()" id="refBtn"><i class="ti ti-refresh" style="font-size:14px" aria-hidden="true"></i>새로고침</button>
      <button class="btn-p" id="addBtn" onclick="openAdd()"><i class="ti ti-plus" aria-hidden="true"></i>내역 추가</button>
    </div>
  </div>
  <div class="sum-grid" id="sumGrid"></div>
  <div class="mg">
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tabs">
        <div class="tab act" id="tl" onclick="switchTab('list')"><i class="ti ti-list" aria-hidden="true"></i>목록</div>
        <div class="tab" id="tc" onclick="switchTab('cal')"><i class="ti ti-calendar" aria-hidden="true"></i>달력</div>
      </div>
      <div id="listV"></div>
      <div id="calV" style="display:none"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card" style="padding:0;overflow:hidden" id="varDonutCard"></div>
      <div class="card" style="padding:0;overflow:hidden" id="fixDonutCard"></div>
      <div class="card" style="padding:0;overflow:hidden" id="fixedIncomeCard"></div>
      <div class="card" style="padding:0;overflow:hidden" id="fixedExpenseCard"></div>
    </div>
  </div>
</div>
</div>

<div class="ov" id="addModal" style="display:none" onclick="if(event.target===this)closeAdd()">
  <div class="modal">
    <div class="mh"><span class="mt2" id="modalTitle">지출 추가</span><button class="mc" onclick="closeAdd()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="mb">
      
      <div class="tgl-grp" id="fTypeGroup">
        <div class="tgl-btn act" onclick="setFType('expense')" id="btnExp">지출</div>
        <div class="tgl-btn" onclick="setFType('income')" id="btnInc">수입</div>
      </div>

      <div class="fr">
        <div><label class="fl">날짜</label><input type="date" class="fi3" id="fDate"></div>
        <div><label class="fl">카테고리</label>
          <select class="fi3" id="fCat">
            <option value="급여" class="opt-inc" style="display:none">💰 급여</option>
            <option value="용돈" class="opt-inc" style="display:none">💵 용돈</option>
            <option value="부수입" class="opt-inc" style="display:none">📈 부수입</option>
            <option value="식비" class="opt-exp">🍚 식비</option><option value="교통" class="opt-exp">🚌 교통</option>
            <option value="주거" class="opt-exp">🏠 주거</option><option value="여가" class="opt-exp">🎬 여가</option>
            <option value="의료" class="opt-exp">💊 의료</option><option value="쇼핑" class="opt-exp">🛍️ 쇼핑</option>
            <option value="공과금" class="opt-exp">💡 공과금</option><option value="교육" class="opt-exp">📚 교육</option>
            <option value="기타" class="opt-exp">📦 기타</option><option value="통신" class="opt-exp">📞 통신</option>
            <option value="여행" class="opt-exp">✈️ 여행</option>
            <!-- ★ [수정 사항] 카드값 카테고리 추가 -->
            <option value="카드값" class="opt-exp">💳 카드값</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">내용 <span class="req">*</span></label><input type="text" class="fi3" id="fDet" placeholder="예: 마트 장보기"></div>
      <div class="fg"><label class="fl">금액 <span class="req">*</span></label>
        <div style="display:flex;gap:8px">
          <select class="fi3" id="fCur" style="width:90px;flex-shrink:0;padding:10px" onchange="checkCurrency()">
            <option value="KRW">KRW</option><option value="USD">USD</option>
            <option value="JPY">JPY</option><option value="CNY">CNY</option>
          </select>
          <input type="number" class="fi3" id="fAmt" placeholder="0" min="0" style="flex:1">
        </div>
      </div>
      <div class="fg" id="krwWrap" style="display:none">
        <label class="fl">환산된 원화(₩) 금액 <span class="req">*</span></label>
        <input type="number" class="fi3" id="fKrwAmt" placeholder="예: 45000">
      </div>

      <div class="fg"><label class="fl">메모</label><input type="text" class="fi3" id="fNote" placeholder="선택사항"></div>
      <div class="fe" id="fErr" style="display:none"></div>
      <button class="sub" id="subBtn" onclick="addExpense()"><i class="ti ti-plus" style="font-size:15px" aria-hidden="true"></i>추가하기</button>
    </div>
  </div>
</div>

<div class="ov" id="budgetModal" style="display:none" onclick="if(event.target===this)closeBudget()">
  <div class="modal">
    <div class="mh"><span class="mt2">예산 설정</span><button class="mc" onclick="closeBudget()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="mb">
      <p style="font-size:13px;color:var(--text3);margin-bottom:18px">자산 = 예산 + (고정수입+변동수입) − (고정지출+변동지출)</p>
      <div class="biw"><span class="bpfx" id="bPfx">₩</span><input type="number" class="binp" id="bInp" onkeydown="if(event.key==='Enter')saveBudget()"></div>
      <div class="mbtns">
        <button class="btn-cancel" onclick="closeBudget()">취소</button>
        <button class="btn-save" id="bSaveBtn" onclick="saveBudget()"><i class="ti ti-check" style="font-size:14px" aria-hidden="true"></i>저장</button>
      </div>
    </div>
  </div>
</div>

<script>
// <!-- ★ [수정 사항] 카드값 색상 및 이모지 추가 -->
const CATS={식비:'#F59E0B',교통:'#3B82F6',주거:'#8B5CF6',여가:'#EC4899',의료:'#10B981',쇼핑:'#F97316',공과금:'#06B6D4',교육:'#6366F1',통신:'#14B8A6',여행:'#0EA5E9',기타:'#9CA3AF', 급여:'#10B981',용돈:'#34D399',부수입:'#059669', 카드값:'#475569'}
const EMO={식비:'🍚',교통:'🚌',주거:'🏠',여가:'🎬',의료:'💊',쇼핑:'🛍️',공과금:'💡',교육:'📚',통신:'📞',여행:'✈️',기타:'📦', 급여:'💰',용돈:'💵',부수입:'📈', 카드값:'💳'}
const CUR={
  KRW:{sym:'₩',locale:'ko-KR',dig:0,name:'원'},
  USD:{sym:'$',locale:'en-US',dig:2,name:'달러'},
  JPY:{sym:'¥',locale:'ja-JP',dig:0,name:'엔'},
  CNY:{sym:'¥',locale:'zh-CN',dig:2,name:'위안'}
}
const MON=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']

let GAS=localStorage.getItem('gas_url')||''
let ST={budget:0,currency:'KRW',expenses:[],fixed:[]}
let tab='list',calD=new Date(),selDay=null
let varChart=null,fixChart=null 
let busy=false,editTargetId=null
let editFixedId=null;
let currentModalType = 'expense';

// <!-- ★ [수정 사항] 변동 지출 도넛 차트의 숨김 카테고리를 추적할 Set 추가 -->
let hiddenVarCats = new Set();

function setView(v){
  document.body.classList.remove('force-mobile','force-desktop')
  if(v==='mobile')document.body.classList.add('force-mobile')
  if(v==='desktop')document.body.classList.add('force-desktop')
  localStorage.setItem('view_mode',v)
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('act'))
  document.getElementById('vt-'+v).classList.add('act')
}
setView(localStorage.getItem('view_mode')||'auto')

function fmtCur(n, cur){
  const c=CUR[cur]||CUR.KRW
  return new Intl.NumberFormat(c.locale,{style:'currency',currency:cur,maximumFractionDigits:c.dig,minimumFractionDigits:c.dig}).format(n)
}
function fmt(n){return fmtCur(n,ST.currency)}
function fmtS(n){
  const c=CUR[ST.currency]
  if(ST.currency==='KRW'){if(n>=100000000)return c.sym+(n/100000000).toFixed(1)+'억';if(n>=10000)return c.sym+(n/10000).toFixed(1)+'만';return c.sym+Math.round(n)}
  return c.sym+n.toFixed(c.dig)
}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function sameM(ds,m,y){const d=new Date(ds+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y}

function toast(msg,type='s',dur=3000){
  const a=document.getElementById('toastArea'),t=document.createElement('div')
  t.className=`toast ${type}`
  t.innerHTML=type==='l'?`<div class="spinner"></div>${msg}`:`<i class="ti ${type==='s'?'ti-check':'ti-alert-circle'}" style="font-size:15px" aria-hidden="true"></i>${msg}`
  const id='t'+Date.now()+Math.random();t.id=id;a.appendChild(t)
  if(dur>0)setTimeout(()=>{const el=document.getElementById(id);if(el)el.remove()},dur)
  return id
}
function rmToast(id){const el=document.getElementById(id);if(el)el.remove()}
function setBusy(v){busy=v;['addBtn','refBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=v})}

async function gasGet(params){
  const u=new URL(GAS)
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v))
  const r=await fetch(u.toString(),{redirect:'follow'})
  if(!r.ok)throw new Error('서버 응답 오류 '+r.status)
  return r.json()
}

async function connect(){
  const url=document.getElementById('urlInp').value.trim()
  if(!url.startsWith('https://script.google.com')){toast('올바른 Apps Script URL을 입력해주세요.','e');return}
  GAS=url;localStorage.setItem('gas_url',url)
  const btn=document.getElementById('connBtn')
  btn.disabled=true
  btn.innerHTML='<div class="spinner" style="border-color:rgba(255,255,255,.4);border-top-color:transparent"></div>연결 중...'
  const tid=toast('Google Sheets에 연결 중...','l',0)
  try{
    await loadData();rmToast(tid)
    document.getElementById('setupBanner').style.display='none'
    document.getElementById('main').style.display='block'
    toast('연결 완료!','s');render()
  }catch(e){
    rmToast(tid);toast('연결 실패 — URL을 확인하고 재배포했는지 확인하세요.','e',6000)
    btn.disabled=false;btn.innerHTML='<i class="ti ti-plug" style="font-size:14px"></i>연결'
  }
}

async function loadData(){
  const d=await gasGet({action:'load'})
  ST.expenses=(d.expenses||[]).filter(r=>r.id).map(r=>({
    id:String(r.id),date:String(r.date).substring(0,10),
    category:String(r.category),details:String(r.details),
    amount:Number(r.amount),note:String(r.note||''),
    currency:String(r.currency||'KRW'),
    type:String(r.type||'expense'),
    krw_amount:Number(r.krw_amount||r.amount)
  }))
  ST.fixed=(d.fixed||[]).filter(r=>r.id).map(r=>({
    id:String(r.id),name:String(r.name),amount:Number(r.amount),
    category:String(r.category||'기타'),
    type:String(r.type||'expense')
  }))
  ;(d.settings||[]).forEach(s=>{
    if(s.key==='budget')ST.budget=(s.value!==''&&!isNaN(s.value))?Number(s.value):0
    if(s.key==='currency')ST.currency=String(s.value)||'KRW'
  })
}

async function refreshData(){
  if(busy)return;setBusy(true)
  const tid=toast('데이터 불러오는 중...','l',0)
  try{await loadData();rmToast(tid);toast('최신 데이터 불러옴','s')}
  catch(e){rmToast(tid);toast('불러오기 실패: '+e.message,'e',4000)}
  finally{setBusy(false);render()}
}

function setFType(type){
  currentModalType = type;
  document.getElementById('btnExp').classList.toggle('act', type==='expense');
  document.getElementById('btnInc').classList.toggle('act', type==='income');
  document.querySelectorAll('.opt-exp').forEach(el=>el.style.display = type==='expense'?'block':'none');
  document.querySelectorAll('.opt-inc').forEach(el=>el.style.display = type==='income'?'block':'none');
  document.getElementById('fCat').value = type==='expense' ? '식비' : '급여';
}

function checkCurrency() {
  const isKrw = document.getElementById('fCur').value === 'KRW';
  document.getElementById('krwWrap').style.display = isKrw ? 'none' : 'block';
  if(isKrw) document.getElementById('fKrwAmt').value = '';
}

async function addExpense(){
  const det=document.getElementById('fDet').value.trim()
  const amt=parseFloat(document.getElementById('fAmt').value)
  const cur=document.getElementById('fCur').value
  const krw_amt = cur === 'KRW' ? amt : parseFloat(document.getElementById('fKrwAmt').value);

  if(!det){showFErr('내용을 입력해주세요.');return}
  if(!amt||amt<=0){showFErr('올바른 금액을 입력해주세요.');return}
  if(cur !== 'KRW' && (!krw_amt || krw_amt<=0)){showFErr('환산된 원화 금액을 입력해주세요.');return}

  const item={
    id:editTargetId||`${Date.now()}-${Math.random().toFixed(8)}`,
    date:document.getElementById('fDate').value,
    type:currentModalType,
    category:document.getElementById('fCat').value,
    details:det,amount:amt,
    note:document.getElementById('fNote').value.trim(),
    currency:cur,
    krw_amount:krw_amt 
  }
  const btn=document.getElementById('subBtn')
  btn.disabled=true;setBusy(true)
  const tid=toast(editTargetId?'수정 중...':'저장 중...','l',0)
  try{
    if(editTargetId){
      await gasGet({action:'deleteExpense',id:editTargetId})
      ST.expenses=ST.expenses.filter(e=>e.id!==editTargetId)
    }
    await gasGet({action:'addExpense',data:JSON.stringify(item)})
    ST.expenses.unshift(item)
    rmToast(tid);toast(editTargetId?'수정되었습니다.':'저장되었습니다.','s')
    closeAdd();render()
  }catch(e){rmToast(tid);toast('실패: '+e.message,'e',4000)}
  finally{btn.disabled=false;btn.innerHTML=editTargetId?'<i class="ti ti-check"></i> 수정하기':'<i class="ti ti-plus"></i> 추가하기';setBusy(false)}
}
function showFErr(m){const e=document.getElementById('fErr');e.textContent=m;e.style.display='block'}

async function delExpense(id){
  if(busy)return;setBusy(true)
  const tid=toast('삭제 중...','l',0)
  try{await gasGet({action:'deleteExpense',id});ST.expenses=ST.expenses.filter(e=>e.id!==id);rmToast(tid);toast('삭제되었습니다.','s')}
  catch(e){rmToast(tid);toast('삭제 실패: '+e.message,'e',4000)}
  finally{setBusy(false);render()}
}

async function addFixed(type = 'expense'){
  const suffix = type === 'income' ? 'Inc' : '';
  const name=document.getElementById('fxName'+suffix).value.trim()
  const amt=parseFloat(document.getElementById('fxAmt'+suffix).value)
  const cat=document.getElementById('fxCat'+suffix).value
  if(!name||!amt||amt<=0){toast('항목명과 금액을 입력해주세요.','e');return}
  
  const targetId = editFixedId || `${Date.now()}-${Math.random().toFixed(8)}`;
  const item={id:targetId, type, name, amount:amt, category:cat}
  
  const addB=document.getElementById('addFixBtn'+suffix);
  if(addB)addB.disabled=true;setBusy(true)
  const tid=toast(editFixedId ? '수정 중...' : '저장 중...','l',0)
  try{
    if(editFixedId) {
       await gasGet({action:'deleteFixed',id:editFixedId});
       ST.fixed=ST.fixed.filter(e=>e.id!==editFixedId);
    }
    await gasGet({action:'addFixed',data:JSON.stringify(item)})
    ST.fixed.push(item);rmToast(tid);toast(editFixedId?'수정되었습니다.':'저장되었습니다.','s')
    editFixedId = null;
    document.getElementById('fxName'+suffix).value = '';
    document.getElementById('fxAmt'+suffix).value = '';
  }catch(e){rmToast(tid);toast('저장 실패: '+e.message,'e',4000)}
  finally{setBusy(false);if(addB){addB.disabled=false; addB.innerHTML='<i class="ti ti-plus" aria-hidden="true"></i>';}render()}
}

async function delFixed(id){
  if(busy)return;setBusy(true)
  const tid=toast('삭제 중...','l',0)
  try{await gasGet({action:'deleteFixed',id});ST.fixed=ST.fixed.filter(e=>e.id!==id);rmToast(tid);toast('삭제되었습니다.','s')}
  catch(e){rmToast(tid);toast('삭제 실패: '+e.message,'e',4000)}
  finally{setBusy(false);render()}
}

async function saveBudget(){
  const v=parseFloat(document.getElementById('bInp').value)
  if(isNaN(v)||v<0)return;ST.budget=v
  const btn=document.getElementById('bSaveBtn')
  btn.disabled=true;btn.innerHTML='<div class="spinner" style="border-color:rgba(255,255,255,.4);border-top-color:transparent;display:inline-block"></div> 저장 중...'
  const tid=toast('예산 저장 중...','l',0)
  try{await gasGet({action:'saveSettings',data:JSON.stringify({budget:ST.budget,currency:ST.currency})});rmToast(tid);toast('예산이 저장되었습니다.','s');closeBudget();render()}
  catch(e){rmToast(tid);toast('저장 실패: '+e.message,'e',4000)}
  finally{btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i> 저장'}
}

function render(){
  renderSum()
  if(tab==='list'){
    document.getElementById('listV').style.display='block';
    document.getElementById('calV').style.display='none';
    renderList();
  } else {
    document.getElementById('listV').style.display='none';
    document.getElementById('calV').style.display='block';
    renderCal();
  }
  renderFixedList('income');
  renderFixedList('expense');
  renderVarDonut()
  renderFixDonut() 
}

function renderSum(){
  const now=new Date(),tm=now.getMonth(),ty=now.getFullYear()
  const fixExp = ST.fixed.filter(f=>f.type==='expense').reduce((s,e)=>s+e.amount,0);
  const fixInc = ST.fixed.filter(f=>f.type==='income').reduce((s,e)=>s+e.amount,0);
  const allExpKRW = ST.expenses.filter(e=>e.type==='expense').reduce((s,e)=>s+e.krw_amount,0);
  const allIncKRW = ST.expenses.filter(e=>e.type==='income').reduce((s,e)=>s+e.krw_amount,0);
  const tmExpKRW = ST.expenses.filter(e=>sameM(e.date,tm,ty)&&e.type==='expense').reduce((s,e)=>s+e.krw_amount,0);
  const tmIncKRW = ST.expenses.filter(e=>sameM(e.date,tm,ty)&&e.type==='income').reduce((s,e)=>s+e.krw_amount,0);
  const assets = ST.budget + (fixInc + allIncKRW) - (fixExp + allExpKRW);

  document.getElementById('sumGrid').innerHTML=`
  <div class="card card-p">
    <div class="hrow"><div><div class="c-lbl">현재 자산 (KRW)</div><div class="c-amt">${fmtCur(assets,'KRW')}</div></div>
      <button class="ic-btn" onclick="openBudget()" title="예산 설정"><i class="ti ti-settings" aria-hidden="true"></i></button></div>
    <div class="c-sub">예산: ${fmtCur(ST.budget,'KRW')}</div>
  </div>
  <div class="card">
    <div class="c-lbl">${MON[tm]} 요약 (KRW 환산 기준)</div>
    <div class="brow"><span class="lb"><span class="dot" style="background:var(--success)"></span>총 수입 (고정+변동)</span><span class="vl">${fmtCur(fixInc+tmIncKRW,'KRW')}</span></div>
    <div class="brow"><span class="lb"><span class="dot" style="background:var(--danger)"></span>총 지출 (고정+변동)</span><span class="vl">${fmtCur(fixExp+tmExpKRW,'KRW')}</span></div>
    <div class="bdiv"></div>
    <div class="brow"><span class="lb" style="font-weight:600;color:var(--text)">순수익</span><span class="vl" style="color:${(fixInc+tmIncKRW)-(fixExp+tmExpKRW)>=0?'var(--success)':'var(--danger)'}">${fmtCur((fixInc+tmIncKRW)-(fixExp+tmExpKRW),'KRW')}</span></div>
  </div>`
}

function renderList(){
  const el=document.getElementById('listV')
  if(ST.expenses.length===0){
    el.innerHTML=`<div class="empty"><div style="font-size:40px;margin-bottom:12px">💸</div><div style="font-size:14px;margin-bottom:8px;color:var(--text2)">아직 지출 내역이 없어요.</div><button style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-weight:500" onclick="openAdd()">첫 지출을 추가해보세요 →</button></div>`
    return
  }
  el.innerHTML=ST.expenses.map((e,i)=>{
    const isInc = e.type === 'income';
    const mainAmt = (isInc?'+':'') + fmtCur(e.amount, e.currency)
    const foreignTag = e.currency !== 'KRW' 
      ? `<span class="ei-am-foreign">(${fmtCur(e.krw_amount, 'KRW')})</span>` 
      : '';

    return `<div class="ei">
      <div class="cic" style="background:${CATS[e.category]||'#9CA3AF'}22">${EMO[e.category]||'📦'}</div>
      <div class="ei-inf"><div class="ei-nm">${e.details}</div><div class="ei-mt">${e.date} · ${e.category}${e.note?' · '+e.note:''}</div></div>
      <div class="ei-am-wrap">
        <span class="ei-am ${isInc?'inc':'exp'}">${mainAmt}</span>
        ${foreignTag}
      </div>
      <div style="display:flex;gap:2px;flex-shrink:0">
        <button class="exp-del" data-action="edit" data-idx="${i}" title="수정" style="color:var(--accent)"><i class="ti ti-pencil" aria-hidden="true"></i></button>
        <button class="exp-del" data-action="del" data-idx="${i}" title="삭제"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>`
  }).join('')
    el.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.idx)
      const expense=ST.expenses[idx]
      if(!expense)return
      if(btn.dataset.action==='edit')openEdit(expense.id)
      if(btn.dataset.action==='del')delExpense(expense.id)
    })
  })
}

function renderCal(){
  const el=document.getElementById('calV')
  const m=calD.getMonth(),y=calD.getFullYear()
  const days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay()
  const now=new Date(),daily={}
  ST.expenses.forEach(e=>{
    if(sameM(e.date,m,y)) {
      daily[e.date] = (daily[e.date]||0) + (e.type==='income' ? e.krw_amount : -e.krw_amount)
    }
  })
  const cells=[]
  for(let i=0;i<first;i++)cells.push('<div></div>')
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const amt=daily[ds],isT=d===now.getDate()&&m===now.getMonth()&&y===now.getFullYear(),isSel=selDay===ds
    cells.push(`<div class="cc ${isSel?'sel':isT?'tod':amt?'has':''}" onclick="selCal('${ds}')"><span>${d}</span>${amt!==undefined&&amt!==0?`<span class="camt" style="color:${amt>0?'var(--success)':'var(--danger)'}">${amt>0?'+':''}${Math.abs(amt/10000).toFixed(0)}만</span>`:''}</div>`)
  }
  const si=selDay?ST.expenses.filter(e=>e.date===selDay):[]
  el.innerHTML=`<div class="cn">
    <button class="cnb" onclick="shiftCal(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
    <span class="ct">${y}년 ${MON[m]}</span>
    <button class="cnb" onclick="shiftCal(1)"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
  </div>
  <div class="cg">${['일','월','화','수','목','금','토'].map(d=>`<div class="ch">${d}</div>`).join('')}${cells.join('')}</div>
  ${selDay?`<div class="cd">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;color:var(--text3)">${selDay}</span>
    </div>
    ${si.length===0?`<p style="font-size:12px;color:var(--text3);text-align:center;padding:10px 0">이 날 내역 없음</p>`
    :si.map(e=>`<div style="display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:8px">
      <span style="font-size:18px">${EMO[e.category]||'📦'}</span>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.details}</div>
      <div style="font-size:11px;color:var(--text3)">${e.category}${e.note?' · '+e.note:''}</div></div>
      <div style="text-align:right">
        <div style="font-size:13px;font-weight:600;color:${e.type==='income'?'var(--success)':'var(--text)'}">${e.type==='income'?'+':''}${fmtCur(e.amount,e.currency)}</div>
        ${e.currency!=='KRW'?`<div style="font-size:10px;color:var(--text3)">${fmtCur(e.krw_amount,'KRW')}</div>`:''}
      </div>
    </div>`).join('')}
  </div>`:''}`
}

function renderFixedList(type) {
  const isInc = type === 'income';
  const suffix = isInc ? 'Inc' : ''; 
  const list = ST.fixed.filter(f => f.type === type);
  const total = list.reduce((s,e)=>s+e.amount, 0);
  
  const html = `
  <div class="sh"><span class="st2">매월 고정 ${isInc?'수입':'지출'}</span><span class="fbadge ${isInc?'inc':''}">${fmtCur(total,'KRW')}/월</span></div>
  ${list.length===0?'<p style="font-size:12px;color:var(--text3);padding:0 18px 12px">아직 없음</p>':''}
  ${list.map(f=>`<div class="fi2">
    <div class="fi2-left">
      <div class="fi2-icon" style="background:${CATS[f.category]||'#9CA3AF'}22">${EMO[f.category]||'📦'}</div>
      <span class="fi2-name">${f.name}</span>
      <span class="fi2-cat">${f.category||'기타'}</span>
    </div>
    <div class="fi2-right">
      <span style="font-size:13px;font-weight:600;color:${isInc?'var(--success)':'var(--text)'}">${isInc?'+':''}${fmtCur(f.amount,'KRW')}</span>
      <button class="fix-del" onclick="openEditFixed('${f.id}')" title="수정" style="color:var(--accent)"><i class="ti ti-pencil" aria-hidden="true"></i></button>
      <button class="fix-del" onclick="delFixed('${f.id}')" ${busy?'disabled':''}><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>
  </div>`).join('')}
  <div class="finp">
    <input class="fi3 fx-name" type="text" id="fxName${suffix}" placeholder="항목명" onkeydown="if(event.key==='Enter')addFixed('${type}')">
    <select class="fi3 fx-cat" id="fxCat${suffix}">
      ${isInc 
        ? `<option value="급여">💰 급여</option><option value="부수입">📈 부수입</option>` 
        : `<option value="주거">🏠 주거</option><option value="공과금">💡 공과금</option><option value="교통">🚌 교통</option><option value="교육">📚 교육</option><option value="의료">💊 의료</option><option value="식비">🍚 식비</option><option value="여가">🎬 여가</option><option value="쇼핑">🛍️ 쇼핑</option><option value="통신">📞 통신</option>`
      }
      <option value="기타">📦 기타</option>
    </select>
    <input class="fi3 fx-amt" type="number" id="fxAmt${suffix}" placeholder="₩" onkeydown="if(event.key==='Enter')addFixed('${type}')">
    <button class="inp-add" id="addFixBtn${suffix}" onclick="addFixed('${type}')" ${busy?'disabled':''}><i class="ti ti-plus" aria-hidden="true"></i></button>
  </div>`;
  
  document.getElementById(isInc ? 'fixedIncomeCard' : 'fixedExpenseCard').innerHTML = html;
}

// <!-- ★ [수정 사항] 클릭 시 필터링을 위한 toggle 함수 추가 -->
function toggleVarCat(c){
  if(hiddenVarCats.has(c)) hiddenVarCats.delete(c);
  else hiddenVarCats.add(c);
  renderVarDonut();
}

// <!-- ★ [수정 사항] 클릭 이벤트, 숨김 처리 UI 반영, 필터링 된 데이터로 차트 렌더링 -->
function renderVarDonut(){
  const now=new Date(),m=now.getMonth(),y=now.getFullYear()
  const map={}
  ST.expenses.filter(e=>sameM(e.date,m,y)&&e.type==='expense').forEach(e=>{map[e.category]=(map[e.category]||0)+e.krw_amount})
  
  // 전체 카테고리 (금액순 정렬)
  const allKeys=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  const el=document.getElementById('varDonutCard')
  
  if(allKeys.length===0){
    el.innerHTML=`<div class="sh"><span class="st2">변동비 카테고리</span></div><p style="font-size:12px;color:var(--text3);padding:0 18px 16px">이번 달 지출 없음</p>`
    if(varChart){varChart.destroy();varChart=null}
    return
  }

  el.innerHTML=`<div class="sh"><span class="st2">${MON[m]} 변동 지출 (원화 환산)</span><span style="font-size:10px;color:var(--text3);cursor:help" title="항목 클릭 시 차트에서 숨길 수 있습니다">👆 항목 클릭 시 ON/OFF</span></div>
  <div class="dw">
    <div style="width:120px;height:120px;margin-bottom:12px"><canvas id="varDC"></canvas></div>
    ${allKeys.map(k=>`<div class="lr" onclick="toggleVarCat('${k}')" style="cursor:pointer; opacity:${hiddenVarCats.has(k)?'0.35':'1'}; transition:opacity 0.2s">
      <span class="llb"><span class="ldot" style="background:${CATS[k]||'#9CA3AF'}"></span>${EMO[k]||''} ${k}</span>
      <span class="lv" style="text-decoration:${hiddenVarCats.has(k)?'line-through':'none'}">${fmtCur(map[k],'KRW')}</span>
    </div>`).join('')}
  </div>`
  
  if(varChart){varChart.destroy();varChart=null}
  
  // 숨겨지지 않은(체크된) 항목만 골라서 차트 데이터에 넣음
  const visibleKeys = allKeys.filter(k => !hiddenVarCats.has(k));
  const visibleData = visibleKeys.map(k => map[k]);
  const visibleColors = visibleKeys.map(k => CATS[k]||'#9CA3AF');

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('varDC');if(!ctx)return
    varChart=new Chart(ctx,{
      type:'doughnut',
      data:{
        labels:visibleKeys,
        // 선택된 항목이 하나도 없을 경우 빈 회색 도넛 표시
        datasets:[{
          data:visibleData.length?visibleData:[1],
          backgroundColor:visibleData.length?visibleColors:['#E5E7EB'],
          borderWidth:0
        }]
      },
      options:{
        plugins:{
          legend:{display:false},
          tooltip:{enabled:visibleData.length>0}
        },
        cutout:'70%'
      }
    })
  })
}

function renderFixDonut(){
  const el=document.getElementById('fixDonutCard')
  const map={}
  ST.fixed.filter(f=>f.type==='expense').forEach(f=>{map[f.category]=(map[f.category]||0)+f.amount})
  const keys=Object.keys(map)
  if(keys.length===0){
    el.innerHTML=`<div class="sh"><span class="st2">고정비 카테고리</span></div><p style="font-size:12px;color:var(--text3);padding:0 18px 16px">고정 지출 없음</p>`
    if(fixChart){fixChart.destroy();fixChart=null}
    return
  }
  el.innerHTML=`<div class="sh"><span class="st2">고정비 카테고리</span></div>
  <div class="dw">
    <div style="width:120px;height:120px;margin-bottom:12px"><canvas id="fixDC"></canvas></div>
    ${Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="lr"><span class="llb"><span class="ldot" style="background:${CATS[k]||'#9CA3AF'}"></span>${EMO[k]||''} ${k}</span><span class="lv">${fmtCur(v,'KRW')}</span></div>`).join('')}
  </div>`
  if(fixChart){fixChart.destroy();fixChart=null}
  requestAnimationFrame(()=>{
    const ctx=document.getElementById('fixDC');if(!ctx)return
    fixChart=new Chart(ctx,{type:'doughnut',data:{labels:keys,datasets:[{data:keys.map(k=>map[k]),backgroundColor:keys.map(k=>CATS[k]||'#9CA3AF'),borderWidth:0}]},options:{plugins:{legend:{display:false}},cutout:'70%'}})
  })
}

function openEdit(id){
  const e=ST.expenses.find(x=>x.id===id);if(!e)return
  editTargetId=id
  setFType(e.type || 'expense');
  document.getElementById('fDate').value=e.date
  document.getElementById('fCat').value=e.category
  document.getElementById('fDet').value=e.details
  document.getElementById('fCur').value=e.currency||'KRW'
  document.getElementById('fAmt').value=e.amount
  document.getElementById('fKrwAmt').value=e.krw_amount || e.amount || '';
  checkCurrency(); 
  document.getElementById('fNote').value=e.note||''
  document.getElementById('fErr').style.display='none'
  document.getElementById('modalTitle').textContent='내역 수정'
  document.getElementById('subBtn').innerHTML='<i class="ti ti-check" aria-hidden="true"></i> 수정하기'
  document.getElementById('addModal').style.display='flex'
}
  
function openEditFixed(id){
  const f = ST.fixed.find(x => x.id === id);
  if(!f) return;
  editFixedId = id;
  const isInc = f.type === 'income';
  const suffix = isInc ? 'Inc' : '';
  document.getElementById('fxCat'+suffix).value = f.category || (isInc ? '급여' : '기타');
  document.getElementById('fxName'+suffix).value = f.name;
  document.getElementById('fxAmt'+suffix).value = f.amount;
  const addB = document.getElementById('addFixBtn'+suffix);
  if(addB) addB.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>';
}
  
function openAdd(){
  editTargetId=null
  setFType('expense') 
  document.getElementById('fDate').value=today()
  document.getElementById('fDet').value=''
  document.getElementById('fAmt').value=''
  document.getElementById('fKrwAmt').value='' 
  document.getElementById('fNote').value=''
  document.getElementById('fCur').value='KRW' 
  checkCurrency() 
  document.getElementById('fErr').style.display='none'
  document.getElementById('modalTitle').textContent='내역 추가'
  document.getElementById('subBtn').innerHTML='<i class="ti ti-plus" aria-hidden="true"></i> 추가하기'
  document.getElementById('addModal').style.display='flex'
  setTimeout(()=>document.getElementById('fDet').focus(),100)
}
function closeAdd(){document.getElementById('addModal').style.display='none'}
function openBudget(){document.getElementById('bInp').value=ST.budget;document.getElementById('bPfx').textContent=CUR[ST.currency].sym;document.getElementById('budgetModal').style.display='flex';setTimeout(()=>document.getElementById('bInp').focus(),100)}
function closeBudget(){document.getElementById('budgetModal').style.display='none'}

function switchTab(t){
  tab=t;
  document.getElementById('tl').classList.toggle('act',t==='list');
  document.getElementById('tc').classList.toggle('act',t==='cal');
  if(t==='list'){
    document.getElementById('listV').style.display='block';
    document.getElementById('calV').style.display='none';
    renderList();
  } else {
    document.getElementById('listV').style.display='none';
    document.getElementById('calV').style.display='block';
    renderCal();
  }
}

if(GAS){document.getElementById('urlInp').value=GAS;document.getElementById('setupBanner').style.display='none';document.getElementById('main').style.display='block';refreshData()}

</script>
